<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RoyaleX</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="brand">♛ RoyaleX</div>

  <main id="content"></main>
  <nav>
    <button data-page="home">🎮<small>Игры</small></button>
    <button data-page="shop">🛒<small>Магазин</small></button>
    <button data-page="profile">👤<small>Профиль</small></button>
    <button data-page="leaderboard">🏆<small>Топ</small></button>
    <button data-page="rules">📜<small>Правила</small></button>
    <button id="adminNav" data-page="admin" hidden>⚙️<small>Админ</small></button>
  </nav>
</div>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
